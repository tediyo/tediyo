name: Update GitHub Analytics

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/github-analytics.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # GitHub Stats
      # -----------------------------
      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: stats
          options: username=tediyo&show_icons=true&count_private=true&include_all_commits=true&theme=tokyonight&hide_border=true&custom_title=GitHub%20Stats
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------
      # Top Languages
      # -----------------------------
      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=tediyo&layout=compact&langs_count=8&theme=tokyonight&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------
      # GitHub Streak
      # -----------------------------
      - name: Generate GitHub Streak
        uses: zients/github-readme-streak-stats@v2
        with:
          options: user=tediyo&theme=tokyonight&hide_border=true&border_radius=10&disable_animations=true
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------
      # Commit generated cards
      # -----------------------------
      - name: Commit analytics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update GitHub analytics"
          git push
